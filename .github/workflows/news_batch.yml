name: 📰 Daily AI News Pulse Batch Scheduler

on:
  schedule:
    # 매일 한국 시간 오전 06:00 (UTC 21:00)에 자동 실행
    - cron: '0 21 * * *'
  workflow_dispatch: # GitHub 웹 콘솔에서 버튼 클릭으로 언제든 수동 배치 실행 가능

jobs:
  trigger-news-batch:
    runs-on: ubuntu-latest
    steps:
      - name: ⚡ 1. Wake up Render Backend Server (Warmup Ping)
        run: |
          echo "🌐 Sending Health Check Ping to wake up Render Backend Spin-Down Server..."
          curl -s --max-time 30 "https://llm-compass-backend.onrender.com/api/v1/health" || true
          echo "⏳ Waiting 10 seconds for Render server and Neon DB pool to stabilize..."
          sleep 10

      - name: 🚀 2. Execute AI News Refresh Batch Job with Retries
        run: |
          echo "Starting GitHub Actions AI News Pulse Batch Trigger..."
          
          # 백엔드 BackgroundTasks 비동기 기동으로 0.1초 내 HTTP 200 OK 응답 수령
          curl -v -X POST "https://llm-compass-backend.onrender.com/api/v1/news/pulse/refresh" \
               -H "Content-Type: application/json" \
               --connect-timeout 30 \
               --max-time 60 \
               --retry 3 \
               --retry-delay 5

          echo "✅ Successfully triggered news batch pipeline in background on Render backend!"
