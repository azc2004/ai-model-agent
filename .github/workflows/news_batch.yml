name: 📰 Daily AI News Pulse Batch Scheduler

on:
  schedule:
    # 매일 한국 시간 오전 06:00 (UTC 21:00)에 자동 실행
    - cron: '0 21 * * *'
  workflow_dispatch: # GitHub 웹 콘솔에서 버튼 클릭으로 언제든 수동 배치 실행 가능

jobs:
  trigger-news-batch:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Trigger AI News Refresh API on Render Backend
        run: |
          echo "Starting GitHub Actions Cron Trigger..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://llm-compass-backend.onrender.com/api/v1/news/pulse/refresh" \
               -H "Content-Type: application/json")
          
          echo "Response Output:"
          echo "$RESPONSE"
          
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" -eq 200 ]; then
            echo "✅ Successfully triggered news batch pipeline on Render backend!"
          else
            echo "⚠️ Backend responded with HTTP status $STATUS. Retrying in 15 seconds..."
            sleep 15
            curl -f -X POST "https://llm-compass-backend.onrender.com/api/v1/news/pulse/refresh" -H "Content-Type: application/json"
          fi
