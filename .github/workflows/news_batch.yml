name: 📰 Daily AI News D1 Batch Collector

on:
  schedule:
    # 매일 한국시간 오전 07:00 (UTC 22:00)에 자동 실행
    - cron: '0 22 * * *'
  workflow_dispatch: # GitHub 웹 콘솔에서 수동 실행 가능

jobs:
  news-d1-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📦 1. 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 2. Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📚 3. 의존성 설치
        run: pip install feedparser beautifulsoup4

      - name: 🗞️ 4. RSS 뉴스 수집 및 D1 SQL 생성
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📡 26개 RSS 소스에서 AI 뉴스 수집 시작..."
          python3 backend/scripts/news_d1_batch.py --dry-run
          echo "✅ SQL 파일 생성 완료: seed_news_batch.sql"
          wc -l seed_news_batch.sql || true

      - name: ☁️ 5. Cloudflare D1에 뉴스 적재
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler
          echo "🚀 Cloudflare D1에 수집된 뉴스 기사 UPSERT 중..."
          npx wrangler d1 execute llm-compass-db --remote --file=seed_news_batch.sql
          echo "🎉 D1 뉴스 배치 적재 완료!"

      - name: 📊 6. 완료 확인
        run: |
          echo "📈 D1 최신 기사 수 확인..."
          curl -s "https://ai-model-agent.ai-azc2004.workers.dev/api/v1/news/pulse" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(f'✅ D1 기사 수: {d[\"total_count\"]}개')"
