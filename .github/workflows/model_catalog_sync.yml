name: 🤖 Weekly LLM Model Catalog D1 Sync

on:
  schedule:
    # 매주 월요일 한국시간 오전 06:00 (UTC 일요일 21:00)에 자동 실행
    - cron: '0 21 * * 0'
  workflow_dispatch: # GitHub 웹 콘솔에서 수동 실행 가능

jobs:
  model-d1-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📦 1. 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 2. Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🤖 3. OpenRouter API 수집 및 D1 SQL 생성
        run: |
          echo "📡 OpenRouter API에서 최신 LLM 모델 수집 시작..."
          python3 backend/scripts/model_d1_batch.py --dry-run
          echo "✅ SQL 파일 생성 완료"
          wc -l seed_models_batch.sql || true

      - name: ☁️ 4. Cloudflare D1에 모델 카탈로그 UPSERT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler
          echo "🚀 Cloudflare D1 models 테이블 갱신 중..."
          npx wrangler d1 execute llm-compass-db --remote --file=seed_models_batch.sql
          echo "✅ D1 모델 카탈로그 갱신 완료!"

      - name: 🌐 5. 신규 모델 설명 다국어 백필
        run: |
          echo "🌐 description_i18n 이 비어 있는 모델 번역 중..."
          python3 backend/scripts/translate_model_descriptions.py --missing-only
          if [ -s seed_model_i18n.sql ]; then
            npx wrangler d1 execute llm-compass-db --remote --file=seed_model_i18n.sql
            echo "✅ 다국어 설명 갱신 완료"
          else
            echo "ℹ️ 새로 번역할 모델 없음"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 📊 6. 완료 확인
        run: |
          echo "📈 D1 최신 모델 수 확인..."
          curl -s "https://ai-model-agent.ai-azc2004.workers.dev/api/v1/models" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print(f'✅ D1 모델 수: {len(d)}개')"
