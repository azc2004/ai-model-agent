name: 🚀 Cloudflare Workers Frontend Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/cloudflare-pages.yml'
      - 'wrangler.toml'
      # Worker 소스와 그 의존성. 빠져 있어서 src/worker.ts 를 고쳐도 배포되지 않았고,
      # 고쳤다고 믿은 채 프로덕션은 옛 코드로 도는 상태가 만들어졌다.
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Frontend to Cloudflare Workers

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: 🧪 Unit and component tests
        run: cd frontend && npm test

      - name: 🔍 Lint
        run: cd frontend && npm run lint -- --quiet

      - name: 🎭 Install Playwright Chromium
        run: cd frontend && npx playwright install --with-deps chromium

      - name: 🧭 Responsive and accessibility E2E
        run: cd frontend && npm run test:e2e

      - name: 🏗️ Build Frontend (Vite + TypeScript)
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: 🔍 Verify Deployment Environment & Secrets
        run: |
          echo "Checking Secrets configuration..."
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "❌ [FATAL ERROR] secret 'CLOUDFLARE_API_TOKEN' is not defined or empty in GitHub Repository Secrets!"
            echo "👉 Fix: Go to GitHub Repo -> Settings -> Secrets and variables -> Actions -> Add 'CLOUDFLARE_API_TOKEN'"
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "❌ [FATAL ERROR] secret 'CLOUDFLARE_ACCOUNT_ID' is not defined or empty in GitHub Repository Secrets!"
            echo "👉 Fix: Go to GitHub Repo -> Settings -> Secrets and variables -> Actions -> Add 'CLOUDFLARE_ACCOUNT_ID'"
            exit 1
          fi
          echo "✅ Secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are present."
          echo "Checking frontend build dist folder..."
          ls -la frontend/dist

      # Worker(src/worker.ts)가 @sentry/cloudflare 를 import 한다. 프론트엔드에서만
      # npm ci 를 돌리면 루트 의존성이 없어 wrangler 번들 단계에서 resolve 에 실패한다.
      - name: 📦 Install Worker Dependencies
        run: npm ci

      - name: ☁️ Deploy to Cloudflare Workers via Wrangler CLI
        run: |
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 배포가 성공했다고 워커가 요청을 처리한다는 뜻이 아니다. 실제로 세 번,
      # 핸들러도 바인딩도 없는 버전이 100% 트래픽을 받으면서 모든 경로가 SPA 셸을
      # 200 으로 돌려줬다. 배포 직후 서비스가 살아 있는지 직접 확인한다.
      - name: 🩺 배포 검증
        run: |
          set -uo pipefail
          BASE=https://llmcompass.azclab.com
          for i in $(seq 1 10); do
            ct=$(curl -sS -o /dev/null -H 'Cache-Control: no-cache' -w '%{content_type}' "$BASE/health" || true)
            case "$ct" in application/json*) echo "✅ /health → $ct"; exit 0 ;; esac
            echo "  대기 ${i}/10 (현재: ${ct:-응답없음})"; sleep 10
          done
          echo "❌ 배포 후 /health 가 JSON 을 돌려주지 않는다. 워커가 요청을 처리하지 못한다."
          echo "   npx wrangler versions list 로 핸들러 있는 버전을 찾아 rollback 하라."
          exit 1
