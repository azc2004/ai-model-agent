name: ⚡ 24/7 Keep-Alive Warm-up Scheduler (Prevent Render Inactivity Sleep)

on:
  schedule:
    # 매 10분마다 자동 실행하여 Render 백엔드가 Sleep 모드(15분)에 빠지는 것을 완전 방지
    - cron: '*/10 * * * *'
  workflow_dispatch: # 수동 실행 가능

jobs:
  keep-backend-warm:
    runs-on: ubuntu-latest
    steps:
      - name: 🔔 Ping Render Backend Service to Keep Warm
        run: |
          echo "Sending Keep-Alive ping to Render Backend..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://llm-compass-backend.onrender.com/api/v1/models?tier=Frontier)
          echo "Backend Response Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Render Backend is WARM and healthy!"
          else
            echo "⚠️ Backend responded with status $HTTP_STATUS. Waking up instance..."
          fi
