name = "ai-model-agent"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

routes = [
  { pattern = "llmcompass.azclab.com", custom_domain = true }
]

[assets]
directory = "frontend/dist"
binding = "ASSETS"
# 워커가 처리해야 하는 경로만 지정한다. true 로 두면 정적 자산 117개까지 전부
# 워커를 깨워 과금 대상이 된다 — 자산은 워커를 거치지 않으면 무료다.
# ⚠️ 워커에 새 경로를 추가하면 반드시 이 목록에도 넣어야 한다. 빠뜨리면 그 경로가
#    조용히 정적 자산(SPA 셸)으로 떨어진다 — 2026-08-30·08-31 장애와 같은 증상이다.
run_worker_first = [
  "/api/*",
  "/health",
  "/admin",
  "/admin/*",
  "/models/*",
  "/news/*",
  "/changelog",
  "/changelog/*",
  "/sitemap.xml",
  "/robots.txt",
  "/llms.txt",
]

[vars]
# Sentry 에러 추적 (DSN은 공개 식별자 — 클라이언트 노출 전제 설계)
SENTRY_DSN = "https://c76c936b0f42c1afd88881068be15820@o4511998126325760.ingest.us.sentry.io/4511998247370752"


[[d1_databases]]
binding = "DB"
database_name = "llm-compass-db"
database_id = "5b9b2878-ecb8-4201-9688-198b37811c66"

# 관측 가능성 — 로그·트레이스를 Grafana Cloud로 export
# (destination은 CF 대시보드에 등록: grafana-logs / grafana-traces).
# persist = false — CF 대시보드 저장 없이 Grafana로만 전송.
[observability]
enabled = true

[observability.traces]
enabled = true
destinations = ["grafana-traces"]
persist = false

[observability.logs]
enabled = true
destinations = ["grafana-logs"]
persist = false

# 익명 수집 엔드포인트는 인증이 없어 누구나 D1 쓰기를 유발할 수 있다.
# 앱 코드로 카운터를 만드는 대신 플랫폼 레이트 리미터를 쓴다.
[[ratelimits]]
name = "TRACK_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
